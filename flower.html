    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="img/flowers.png" type="image/x-icon" />
    <title>Flower</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;500;700&display=swap');

      /* Imagen de atardecer como fondo de pantalla */
      body, .container {
        background-image: url('img/atardecer.jpg') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Quitar fondo oscuro por defecto */
      .night {
        background: transparent !important;
      }

      /* Posicionar y centrar las flores en la parte inferior */
      .flowers {
        position: absolute !important;
        bottom: 0 !important;
        left: 50% !important;
        transform: translateX(-50%) scale(0.65) !important;
        transform-origin: bottom center !important;
        z-index: 10 !important;
      }

      /* Tarjeta flotante superior */
      .card-overlay {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(15, 10, 25, 0.82);
        border: 1px solid rgba(255, 200, 100, 0.5);
        border-radius: 20px;
        padding: 16px 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 150, 50, 0.25);
        max-width: 90%;
        width: 380px;
        font-family: 'Montserrat', sans-serif;
        color: #fff;
        backdrop-filter: blur(8px);
      }

      .card-overlay h1 {
        font-family: 'Caveat', cursive;
        color: #ffe066;
        font-size: 2rem;
        margin-bottom: 4px;
        text-shadow: 0 0 10px rgba(255, 224, 102, 0.6);
      }

      .phrase-container {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 6px 0;
      }

      .phrase {
        color: #f1f2f6;
        font-size: 0.88rem;
        line-height: 1.38;
        font-weight: 300;
        transition: opacity 0.3s ease;
      }

      .btn-next {
        background: linear-gradient(135deg, #ffd700 0%, #ff7700 100%);
        color: #0b131e;
        border: none;
        padding: 8px 20px;
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 180, 0, 0.5);
        outline: none;
        margin-top: 4px;
      }

      #lyrics {
        top: 48% !important;
      }

      /* Ajuste dinámico para celulares */
      @media (max-width: 600px) {
        .flowers {
          transform: translateX(-50%) scale(0.75) !important;
        }

        .card-overlay {
          top: 15px;
          width: 88%;
          padding: 12px 16px;
        }

        .card-overlay h1 {
          font-size: 1.7rem;
        }

        .phrase {
          font-size: 0.82rem;
        }
      }
    </style>

    <script>
      const phrases = [
        "\"Hoy en el día de las flores amarillas, el cielo nos regala este atardecer... pero ni la luz del sol ni la belleza de las flores se comparan con lo hermosa que eres tú. 🌅💛\"",
        "\"Las flores amarillas traen la alegría de la primavera y el atardecer viste el cielo de dorado, pero tu sonrisa es lo que realmente ilumina mi vida. ✨\"",
        "\"Regalar flores amarillas es regalar luz y buenos deseos, pero contemplar este atardecer a tu lado me recuerda que la verdadera luz siempre eres tú. 🌻\"",
        "\"Un pequeño detalle para este día especial: entre todas las flores del mundo y todos los cielos del planeta, tú siempre serás mi favorita. 💛✨\"",
        "\"Espero de corazón que te haya gustado con mucho cariño para ti mi bonita, te quierooo muchooo ❤️🫶 con amor para ti.\""
      ];
      
      let currentPhrase = 0;
      const audio = document.getElementById('bgMusic');

      function playAudioOnInteraction() {
        if (audio && audio.paused) {
          audio.play().catch(err => console.log("Audio en espera de interacción:", err));
        }
        document.removeEventListener('click', playAudioOnInteraction);
        document.removeEventListener('touchstart', playAudioOnInteraction);
      }

      document.addEventListener('click', playAudioOnInteraction);
      document.addEventListener('touchstart', playAudioOnInteraction);

      function nextPhrase() {
        playAudioOnInteraction();
        currentPhrase = (currentPhrase + 1) % phrases.length;
        const phraseEl = document.getElementById('phrase');
        phraseEl.style.opacity = 0;
        setTimeout(() => {
          phraseEl.innerText = phrases[currentPhrase];
          phraseEl.style.opacity = 1;
        }, 300);
      }
    </script>

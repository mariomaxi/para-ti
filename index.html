<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Detalle Especial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;500;700&display=swap');

        *, *::after, *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .night {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-image: radial-gradient(ellipse at top, transparent 0%, #000),
                radial-gradient(ellipse at bottom, #000, rgba(145, 233, 255, 0.15)),
                repeat-x url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="20" cy="20" r="1" fill="%23fff" opacity="0.8"/><circle cx="80" cy="40" r="1.5" fill="%23ffd700" opacity="0.6"/><circle cx="50" cy="80" r="1" fill="%23fff" opacity="0.5"/></svg>');
            z-index: 1;
        }

        .welcome-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .greetings {
            font-family: 'Caveat', cursive;
            font-size: 4.5rem;
            color: #ffe066;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 224, 102, 0.8);
        }

        .greetings span {
            display: inline-block;
            animation: bounce 1.5s infinite alternate;
        }

        .greetings span:nth-child(2) { animation-delay: 0.1s; }
        .greetings span:nth-child(3) { animation-delay: 0.2s; }
        .greetings span:nth-child(4) { animation-delay: 0.3s; }
        .greetings span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .description {
            font-size: 1rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 35px;
            font-weight: 300;
        }

        .botones {
            background: linear-gradient(135deg, #ffd700 0%, #ff9900 100%);
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .botones a {
            color: #0b131e;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .botones:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="night"></div>

    <div class="welcome-container">
        <div class="greetings">
            <span>H</span><span>o</span><span>l</span><span>a</span><span>!</span>
        </div>
        <div class="description">
            <span>ESTE DETALLE ES PARA TI ❤️</span>
        </div>
        <button class="botones">
            <a href="flower.html">CLICK AQUÍ ✨</a>
        </button>
    </div>
</body>
</html>
